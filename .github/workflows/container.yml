# Builds and publishes the private Galaxy container image to GHCR.
#
# Privacy: the image is published to the private GHCR package
# ghcr.io/renab/galaxy. This workflow never changes package visibility and
# never publishes anything public. The package must remain Private on the
# renab account (GitHub > your profile > Packages > galaxy > Visibility:
# Private); a GITHUB_TOKEN push does not modify that setting.
#
# Deployment identifier: the immutable full commit SHA tag. The additional
# `main` tag is a human-friendly pointer only and must not be used as the
# deployment identifier. See docs/container-deployment.md.

name: container

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Build (type check)
        run: npm run build

      - name: Download SDE database required by the test suite
        run: |
          node --input-type=module -e "
            const { pathToFileURL } = await import('node:url');
            const { downloadSde } = await import(pathToFileURL('./dist/downloader.js').href);
            console.log(await downloadSde());
          "

      - name: Run test suite
        run: npm test

  image:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref_name == 'main'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/galaxy:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/galaxy:main
