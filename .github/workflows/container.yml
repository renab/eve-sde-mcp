# Builds and publishes the Galaxy container image to GHCR.
#
# Visibility: the repository is public and the ghcr.io/renab/galaxy package
# is public — anyone can pull the image without authentication. That is safe
# by construction: the image contains only the base image, the compiled
# dist/, production node_modules, and an empty /home/node/.eve-sde state
# directory. No secrets, no PII, no data (verified by pulling the published
# image and scanning its full filesystem). All sensitive state — SDE
# database, auth tokens, ledger, Nexum keys — lives on the mounted state
# volume, never in the image. Keep it that way: do not add secrets,
# credentials, or personal data to the Dockerfile or to any path it copies.
#
# Deployment identifier: the immutable full commit SHA tag. The additional
# `main` tag is a human-friendly pointer only and must not be used as the
# deployment identifier. See docs/container-deployment.md.

name: container

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Build (type check)
        run: npm run build

      - name: Download SDE database required by the test suite
        run: |
          node --input-type=module -e "
            const { pathToFileURL } = await import('node:url');
            const { downloadSde } = await import(pathToFileURL('./dist/downloader.js').href);
            console.log(await downloadSde());
          "

      - name: Run test suite
        run: npm test

  image:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref_name == 'main'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/galaxy:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/galaxy:main
